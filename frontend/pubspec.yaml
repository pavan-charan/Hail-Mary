name: frontend
description: "Smart Public Sanitation & Drinking Water Management System - Clean Architecture Multi-Platform App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Hardware & Scanner
  mobile_scanner: ^4.0.1
  camera: ^0.10.5+9
  qr_flutter: ^4.1.0

  # Network & Persistence
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  google_fonts: 6.1.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
